<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Haggar Bot</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Haggar Bot">
<meta name="theme-color" content="#0b0b0f"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css?v=2">
</head><body>
<div id="scrim"></div>
<aside id="drawer">
  <div class="dhead"><span>Chats</span><button class="ic" id="closeDrawer" aria-label="Close">✕</button></div>
  <button class="primary wide" id="newChat2">＋ New chat</button>
  <div id="convList"></div>
  <button class="ghost wide" id="openSettings2">⚙︎ Settings</button>
</aside>
<div id="app">
  <header>
    <button class="ic" id="menu" aria-label="Chats">☰</button>
    <div class="title"><span id="hAvatar" class="avatar"></span><div><div id="hName"></div><div id="status">Starting…</div></div></div>
    <button class="ic" id="newChat" aria-label="New chat">✎</button>
    <button class="ic" id="openSettings" aria-label="Settings">⚙︎</button>
  </header>
  <div id="bar"><div></div></div>
  <main id="chat"></main>
  <form id="f">
    <div class="composer"><textarea id="q" rows="1" placeholder="Message…"></textarea>
    <button type="button" id="stop" class="send hidden" aria-label="Stop">■</button>
    <button id="send" class="send" disabled aria-label="Send">↑</button></div>
  </form>
</div>
<section id="settings" class="hidden">
  <header><button class="ic" id="closeSettings">‹</button><div class="title"><div>Settings</div></div></header>
  <div class="sbody">
    <h3>Identity</h3>
    <label>Bot name<input id="s_name"></label>
    <label>Avatar emoji<input id="s_avatar" maxlength="8"></label>
    <label>…or upload image<input type="file" id="s_avatarFile" accept="image/*"></label>
    <button type="button" class="ghost" id="s_avatarClear">Remove uploaded image</button>
    <h3>Appearance</h3>
    <label>Theme<select id="s_theme"><option value="dark">Dark</option><option value="light">Light</option><option value="custom">Custom</option></select></label>
    <label>Accent colour<input type="color" id="s_accent"></label>
    <label>Background colour (custom)<input type="color" id="s_bg"></label>
    <label>Text colour (custom)<input type="color" id="s_fg"></label>
    <label>Font size <b id="v_font"></b><input type="range" id="s_font" min="12" max="26"></label>
    <label>Bubble style<select id="s_bubble"><option value="rounded">Rounded</option><option value="square">Square</option><option value="minimal">Minimal (no bubbles)</option></select></label>
    <h3>Personality</h3>
    <label>System prompt<textarea id="s_prompt" rows="6"></textarea></label>
    <button type="button" class="ghost" id="s_promptReset">Reset to default</button>
    <label>Creativity (temperature) <b id="v_temp"></b><input type="range" id="s_temp" min="0" max="2" step="0.05"></label>
    <label>Max reply length (tokens) <b id="v_max"></b><input type="range" id="s_max" min="64" max="4096" step="64"></label>
    <label>Memory (recent messages sent) <b id="v_ctx"></b><input type="range" id="s_ctx" min="2" max="60" step="2"></label>
    <h3>Model</h3>
    <label>On-device model<select id="s_model"></select></label>
    <p class="hint">Changing model downloads it once (Wi-Fi recommended). Bigger = smarter but slower and needs more memory; 3B+ may crash on phones with 6 GB RAM or less.</p>
    <h3>Data</h3>
    <button type="button" class="ghost" id="exp">Export chats (JSON)</button>
    <label class="ghost btnlike">Import chats (JSON)<input type="file" id="imp" accept="application/json" hidden></label>
    <button type="button" class="danger" id="clearChats">Delete all chats</button>
    <button type="button" class="danger" id="clearAll">Reset everything (incl. downloaded models)</button>
    <p class="hint">Everything stays on this device. No account, no server.</p>
  </div>
</section>
<script type="module" src="app.js?v=2"></script></body></html>
